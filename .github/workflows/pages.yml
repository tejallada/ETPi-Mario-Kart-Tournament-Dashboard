name: Deploy tournament to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with Supabase configuration
        run: |
          missing=0
          if [[ -z "$VITE_SUPABASE_URL" ]]; then
            echo "::error::VITE_SUPABASE_URL is missing from Actions repository variables."
            missing=1
          elif [[ ! "$VITE_SUPABASE_URL" =~ ^https://[^[:space:]/]+/?$ ]]; then
            echo "::error::VITE_SUPABASE_URL must contain only the HTTPS project URL."
            missing=1
          fi
          if [[ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is missing from Actions repository variables."
            missing=1
          elif [[ ! "$VITE_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY must contain only the key beginning with sb_publishable_."
            missing=1
          fi
          if (( missing )); then
            exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
